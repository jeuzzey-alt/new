name: Дайджест психиатрии

on:
  schedule:
    - cron: "55 4 * * *"   # 07:55 по Москве (04:55 UTC), ежедневно
  workflow_dispatch:        # ручной запуск кнопкой "Run workflow"

permissions:
  contents: write           # чтобы сохранять базу уже отправленных статей

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать и отправить дайджест
        env:
          SMTP_HOST: smtp.yandex.ru
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO || secrets.SMTP_USER }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::error::Не заданы секреты SMTP_USER и/или SMTP_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python digest.py

      - name: Сохранить базу отправленных статей
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.sqlite3
          git diff --cached --quiet || git commit -m "Обновлена база отправленных статей ($(date -u +%F))"
          git push
